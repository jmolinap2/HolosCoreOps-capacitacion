<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capacitación financiera · HolosCoreOps</title>
<style>
:root{--bg:#082b30;--surface:#0f3f44;--surface2:#145056;--line:#2f6b70;--text:#eef9f8;--muted:#b7d6d8;--accent:#8ce6df;--on:#06272b;--ok:#8ce6a8;--wait:#f4d58d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1240px;margin:auto;padding:26px 16px 48px}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:4px 0 10px}.lead{max-width:70ch;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:20px}.media{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}.media video{width:100%;height:100%;display:block}.placeholder{height:100%;display:grid;place-content:center;text-align:center;padding:24px;background:linear-gradient(135deg,var(--surface2),var(--surface));color:var(--muted)}.body{padding:14px 2px}.body h2{margin:0 0 6px}.meta{color:var(--muted);font-size:14px}.topics{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;margin-top:14px}.topics h3{margin:0}.topics ul{margin:6px 0 0;padding-left:20px}.side{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px}.side h2{font-size:16px;margin:0 0 12px}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}button{font:inherit}.filters button,.item{border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);padding:7px 11px;cursor:pointer}.filters button[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}.item{display:flex;gap:11px;text-align:left;width:100%;min-height:60px}.n{display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:50%;background:var(--accent);color:var(--on);font-weight:700}.s{display:block;color:var(--muted);font-size:13px}.item[aria-current=true]{outline:2px solid var(--accent)}.state{font-size:13px;color:var(--wait)}.state.ok{color:var(--ok)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:-1}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head><body><main>
<p class="eyebrow">HolosCoreOps · Guías financieras</p><h1>Ventas, compras, caja y contabilidad</h1>
<p class="lead">Cuatro videos cortos para los procesos administrativos que se conectan con Clínica y con el resto de la operación.</p>
<div class="layout"><section id="stage" aria-live="polite"></section><aside class="side"><h2>Ver por función</h2><div id="filters" class="filters"></div><ol id="list"></ol></aside></div>
</main><script src="catalogo.js"></script><script>
(()=>{const roles=window.TRAINING_ROLES||[],videos=window.TRAINING_VIDEOS||[];let active=videos[0],filter='';const $=id=>document.getElementById(id);function show(){const v=active,ready=v.status==='disponible';$('stage').innerHTML=`<div class="media">${ready?`<video controls preload="metadata"><source src="${v.file}" type="video/mp4"><track kind="subtitles" srclang="es" src="${v.subtitles}" default></video>`:`<div class="placeholder"><strong>Video en preparación</strong><span>Se publicará cuando el recorrido local y sus subtítulos estén validados.</span></div>`}</div><div class="body"><h2>${v.title}</h2><div class="meta">Para: ${v.audienceLabel} · ${v.minutes?`${v.minutes} min`:'En preparación'} · <span class="state ${ready?'ok':''}">${ready?'Disponible':'Preparación'}</span></div><p>${v.summary}</p><div class="topics"><h3>En este video</h3><ul>${v.covers.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;for(const el of document.querySelectorAll('.item'))el.setAttribute('aria-current',String(+el.dataset.n===v.number))}function draw(){roles.forEach(r=>{const b=document.createElement('button');b.textContent=r.label;b.setAttribute('aria-pressed',String(filter===r.key));b.onclick=()=>{filter=filter===r.key?'':r.key;draw()};$('filters').append(b)});const list=$('list');list.innerHTML='';videos.filter(v=>!filter||v.audience.includes(filter)).forEach(v=>{const li=document.createElement('li'),b=document.createElement('button');b.className='item';b.dataset.n=v.number;b.innerHTML=`<span class="n">${v.number}</span><span>${v.title}<span class="s">${v.status==='disponible'?'Disponible':v.audienceLabel}</span></span>`;b.onclick=()=>{active=v;show();window.scrollTo({top:0,behavior:'smooth'})};li.append(b);list.append(li)});show()}draw()})();
</script></body></html>
